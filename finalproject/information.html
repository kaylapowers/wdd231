	<!--**************Main- ************-->
	<main>
		<h2 class="info-pageh2">GET INFORMATION ABOUT VANGUARD</h2>
		<div class="main-container">

			<!--***************Join Form********-->
			<div class="form-wrapper">
				<form id="reqinfo" method="get" action="thankyou.html">



					<label for="parentFirst"><span>Parent's First Name:</span></label><br><input type="text"
						id="parentFirst" name="parentFirst" title="Parent First Name" autocomplete="given-name"
						aria-required required>

					<label for="parentLast">Parent's Last Name:</label><br>
					<input type="text" id="parentLast" name="parentLast" title="Parent Last Name"
						autocomplete="family-name" aria-required required>

					<label for="studentFirst">Student's First Name:</label><br>
					<input type="text" id="studentFirst" name="studentFirst" title="Student First Name"
						autocomplete="given-name" aria-required required>

					<label for="studentLast">Student's Last Name:</label><br>
					<input type="text" id="studentLast" name="studentLast" title="Student's Last Name"
						autocomplete="family-name" aria-required required>

					<label for="email">Email:</label><br>
					<input type="email" id="email" name="email" autocomplete="email" placeholder="ImaHere@gmail.com"
						title="email" aria-required required><br>

					<label>
						<input type="checkbox" name="newsletter" value="yes">Please send me your newsletters.
					</label>

					<label for="phone">Mobile Phone Number:</label>
					<input type="tel" id="phone" name="phone" placeholder="222-222-2222" autocomplete="tel" required
						aria-required title="phone">

					<label for="gradeLevel">Grade Level:</label><br>
					<select id="gradeLevel" name="gradeLevel" required>
						<option value="">Select Grade</option>
						<option value="3rd Grade">3rd Grade</option>
						<option value="4th Grade">4th Grade</option>
						<option value="5th Grade">5th Grade</option>
						<option value="6th Grade">6th Grade</option>
						<option value="7th Grade">7th Grade</option>
						<option value="8th Grade">8th Grade</option>
						<option value="9th Grade">9th Grade</option>
						<option value="10th Grade">10th Grade</option>
						<option value="11th Grade">11th Grade</option>
						<option value="12th Grade">12th Grade</option>
					</select><br><br>

					<label for="registerTerm">Registration Term</label>
					<select id="registerTerm" name="registerTerm" required>
						<option value="2025-5">TERM 2025-5</option>
						<option value="2025-6">TERM 2025-6</option>
						<option value="2026-1">TERM 2026-1</option>
						<option value="2026-2">TERM 2026-2</option>
						<option value="2026-3">TERM 2026-3</option>
					</select><br><br>

					<label for="reason">Reason for Transfer</label><br>
					<textarea id="reason" name="reason" title="Reason for Transfer" rows="6" cols="50"
						placeholder="Reason for transfer?"></textarea><br><br>

					<input type="hidden" id="dateRequest" name="dateRequest">

					<input type="submit" value="Get Info Pack">
				</form>

			</div>
			<!--****form-wrapper********-->
			<div>

				<p></p>
				<div id="thanks"></div>
			</div> <!--**** main-content ******-->

		</div>
		<section class="gradebenefits">
			<!--***************grade evel Modal cards********-->

			<div class="container">
				<h1>Educational Activities</h1>
				<div class="grid-container" id="activityGrid"></div>
			</div>

			<!-- The Modal -->
			<div id="activityModal" class="modal">
				<div class="modal-content">
					<span class="close-button">&times;</span>
					<h2 id="modalTitle"></h2>
					<p id="modalDescription"></p>
					<p id="modalDetails"></p>
				</div>
			</div>
		</section>
